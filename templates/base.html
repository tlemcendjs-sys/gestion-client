<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>منصة الطلبات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background: linear-gradient(135deg, #f8f9fa, #e9ecef); min-height: 100vh; }
      .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
      .card { border: none; box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
      .btn-primary { background: #0d6efd; border: none; }
      .btn-primary:hover { background: #0b5ed7; }
      .form-label { font-weight: 600; }
      .footer { color: #6c757d; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand text-primary" href="{{ url_for('index') }}">منصة الطلبات</a>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-primary" href="{{ url_for('admin') }}">لوحة التحكّم</a>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>
    <footer class="footer text-center py-3">
      <div class="container">© {{ 2026 }} جميع الحقوق محفوظة</div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
